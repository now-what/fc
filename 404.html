<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F7F7F4">
    <meta name="description" content="The page you're looking for could not be found.">

    <title>404 - page not found | Francesco Colombo</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22 font-family=%22monospace%22 font-weight=%22bold%22 fill=%22%2363745B%22>&gt;</text></svg>">

    <link rel="stylesheet" href="/assets/style.css">

    <script>
        try {
            var theme = localStorage.getItem('theme');
            if (theme === 'light' || theme === 'dark') {
                document.documentElement.dataset.theme = theme;
            }
        } catch (e) {}

        try {
            var savedLang = localStorage.getItem('preferredLang');
            if (['en', 'it', 'fr'].includes(savedLang)) {
                document.documentElement.lang = savedLang;
            } else {
                var browserLangs = navigator.languages || [navigator.language];
                var detected = browserLangs
                    .map(function (lang) { return lang.slice(0, 2).toLowerCase(); })
                    .find(function (lang) { return ['en', 'it', 'fr'].includes(lang); });

                if (detected) document.documentElement.lang = detected;
            }
        } catch (e) {}
    </script>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to content</a>

    <header>
        <a href="/" class="wordmark" aria-label="Francesco Colombo home">&gt; fc</a>

        <div class="nav-controls">
            <nav class="lang-switcher" aria-label="Language selector">
                <a href="/" lang="en" hreflang="en" id="lang-en">EN</a>
                <a href="/it/" lang="it" hreflang="it" id="lang-it">IT</a>
                <a href="/fr/" lang="fr" hreflang="fr" id="lang-fr">FR</a>
            </nav>

            <button
                type="button"
                class="theme-toggle"
                id="theme-toggle-btn"
                aria-label="Switch to dark theme"
                data-dark-text="Dark"
                data-dark-label="Switch to dark theme"
                data-light-text="Light"
                data-light-label="Switch to light theme"
                hidden>
                Dark
            </button>
        </div>
    </header>

    <main id="main-content" tabindex="-1">
        <section class="error-page">
            <p class="error-code" aria-hidden="true">404</p>

            <h1 id="error-title">Page not found</h1>

            <p id="error-desc">
                You've wandered off the trail. This page doesn't exist.
            </p>

            <a href="/" class="home-link" id="home-link">
                &gt; Back to home
            </a>
        </section>
    </main>

    <footer>
        <span>&copy; 2026 Francesco Colombo</span>
        <span>built with HTML, CSS &amp; vanilla JS</span>
    </footer>

    <script>
        (function () {
            'use strict';

            var translations = {
                en: {
                    title: 'Page not found',
                    desc: "You've wandered off the trail. This page doesn't exist.",
                    home: '> Back to home',
                    pageTitle: '404 - page not found | Francesco Colombo'
                },
                it: {
                    title: 'Pagina non trovata',
                    desc: 'Hai perso il sentiero. Questa pagina non esiste.',
                    home: '> Torna alla home',
                    pageTitle: '404 - pagina non trovata | Francesco Colombo'
                },
                fr: {
                    title: 'Page introuvable',
                    desc: "Vous avez quitté le sentier. Cette page n'existe pas.",
                    home: '> Retour à l’accueil',
                    pageTitle: '404 - page introuvable | Francesco Colombo'
                }
            };

            var root = document.documentElement;
            var lang = translations[root.lang] ? root.lang : 'en';

            function setLanguage(lang) {
                var t = translations[lang];
                if (!t) return;

                root.lang = lang;

                document.getElementById('error-title').textContent = t.title;
                document.getElementById('error-desc').textContent = t.desc;

                var homeLink = document.getElementById('home-link');
                homeLink.textContent = t.home;
                homeLink.href = '/' + lang + '/';

                document.title = t.pageTitle;

                ['en', 'it', 'fr'].forEach(function (code) {
                    var link = document.getElementById('lang-' + code);

                    if (code === lang) {
                        link.setAttribute('aria-current', 'page');
                    } else {
                        link.removeAttribute('aria-current');
                    }
                });

                try {
                    localStorage.setItem('preferredLang', lang);
                } catch (e) {}
            }

            setLanguage(lang);
        })();
    </script>

    <script src="/assets/site.js"></script>
</body>
</html>

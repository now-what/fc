<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — page not found</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22 font-family=%22monospace%22 font-weight=%22bold%22 fill=%22%2363745B%22>&gt;</text></svg>">
    <style>
        :root {
            --bg: #F7F7F4;
            --text: #222620;
            --muted: #656B60;
            --accent: #63745B;
            --border: #D8D8D0;
            --card-bg: #EFEFEA;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --font-sans: system-ui, -apple-system, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #202722;
            --text: #F0F0E9;
            --muted: #BDC5B9;
            --accent: #B7C6A7;
            --border: #333C35;
            --card-bg: #27302A;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 1.5rem;
            gap: 1.5rem;
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-width: 28rem;
        }

        h1 {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.03em;
        }

        p {
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .lang-switcher {
            display: flex;
            gap: 0.75rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .lang-switcher button {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            padding-bottom: 2px;
            border-bottom: 1px solid transparent;
        }

        html[lang="en"] #lang-en,
        html[lang="it"] #lang-it,
        html[lang="fr"] #lang-fr,
        .lang-switcher button:hover {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        a.home-link {
            color: var(--text);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: fit-content;
            margin: 0 auto;
            border-bottom: 1px solid var(--border);
            padding-bottom: 2px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        a.home-link:hover {
            color: var(--accent);
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <nav class="lang-switcher" aria-label="Language selector">
            <button type="button" onclick="setLanguage('en')" id="lang-en">EN</button>
            <button type="button" onclick="setLanguage('it')" id="lang-it">IT</button>
            <button type="button" onclick="setLanguage('fr')" id="lang-fr">FR</button>
        </nav>

        <h1 id="error-title">404 - path not found</h1>
        <p id="error-desc">you've wandered off the trail. this page doesn't exist.</p>
        <a href="/" class="home-link" id="home-text">&gt; back to home</a>
    </div>

    <script>
        var translations = {
            en: {
                title: "404 - path not found",
                desc: "you've wandered off the trail. this page doesn't exist.",
                home: "> back to home"
            },
            it: {
                title: "404 - percorso non trovato",
                desc: "sei uscito dal sentiero. questa pagina non esiste.",
                home: "> torna alla home"
            },
            fr: {
                title: "404 - chemin introuvable",
                desc: "vous avez quitté le sentier. cette page n'existe pas.",
                home: "> retour à l'accueil"
            }
        };

        function setLanguage(lang) {
            if (!translations[lang]) return;
            document.documentElement.setAttribute('lang', lang);
            var t = translations[lang];
            document.getElementById('error-title').textContent = t.title;
            document.getElementById('error-desc').textContent = t.desc;
            document.getElementById('home-text').textContent = t.home;
            try {
                localStorage.setItem('preferredLang', lang);
            } catch(e) {}
        }

        var savedLang = 'en';
        try {
            savedLang = localStorage.getItem('preferredLang') || 'en';
        } catch(e) {}
        
        setLanguage(translations[savedLang] ? savedLang : 'en');
    </script>
</body>
</html>
